<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brew Butterfly Cafe — Admin</title>
<style>
body{margin:0;font-family:Inter,Arial,sans-serif;background:#f6f2ea;color:#241f1c}
header{background:#241f1c;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
main{max-width:1200px;margin:30px auto;padding:0 18px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 8px 30px #00000012}
input,select,button{font:inherit;padding:10px;border:1px solid #ddd;border-radius:8px}
button{cursor:pointer;background:#2f5d50;color:#fff;border:0}
button.danger{background:#a33}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat{padding:18px;border-radius:12px;background:#eee8db}.stat b{font-size:28px;display:block}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;vertical-align:top}
.login{max-width:420px;margin:80px auto}.hidden{display:none}.muted{color:#777}
.actions{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:800px){.grid{grid-template-columns:1fr}table{font-size:13px}}
</style>
</head>
<body>
<header><strong>🦋 Brew Butterfly Cafe Admin</strong><button id="logout">Logout</button></header>
<main>
<section id="loginCard" class="card login">
<h2>Admin Login</h2>
<p class="muted">Use the admin credentials configured in Render.</p>
<input id="username" placeholder="Username" style="width:100%;box-sizing:border-box;margin-bottom:10px">
<input id="password" type="password" placeholder="Password" style="width:100%;box-sizing:border-box;margin-bottom:10px">
<button id="login" style="width:100%">Login</button>
<p id="loginError" style="color:#a33"></p>
</section>

<section id="dashboard" class="hidden">
<div class="grid">
<div class="stat">Total reservations<b id="total">0</b></div>
<div class="stat">Pending<b id="pending">0</b></div>
<div class="stat">Menu items<b id="menuCount">0</b></div>
</div>

<div class="card">
<h2>Reservations</h2>
<div id="reservationTable"></div>
</div>

<div class="card">
<h2>Menu</h2>
<p class="muted">The menu endpoints are connected to the same database.</p>
<div id="menuTable"></div>
</div>
</section>
</main>
<script>
(function(){
'use strict';
const API='https://brew-butterfly-cafe-1.onrender.com';
let token=localStorage.getItem('bbc_admin_token');

const $=id=>document.getElementById(id);
function authHeaders(){return {'Content-Type':'application/json','Authorization':'Bearer '+token};}
async function api(path,options={}){
  const r=await fetch(API+path,{...options,headers:{...(options.headers||{}),...authHeaders()}});
  const b=await r.json().catch(()=>({}));
  if(r.status===401){logout();throw new Error('Session expired.');}
  if(!r.ok)throw new Error(b.error||'Request failed');
  return b;
}
function logout(){localStorage.removeItem('bbc_admin_token');token=null;$('loginCard').classList.remove('hidden');$('dashboard').classList.add('hidden');}
async function load(){
 try{
  const [s,res,m]=await Promise.all([api('/api/admin/stats'),api('/api/admin/reservations'),api('/api/admin/menu')]);
  $('total').textContent=s.totalReservations;$('pending').textContent=s.pendingReservations;$('menuCount').textContent=s.totalMenuItems;
  $('reservationTable').innerHTML='<table><thead><tr><th>Ref</th><th>Customer</th><th>Date</th><th>Guests</th><th>Status</th><th>Action</th></tr></thead><tbody>'+
    res.map(x=>'<tr><td>'+esc(x.id)+'</td><td><b>'+esc(x.name)+'</b><br>'+esc(x.phone)+'</td><td>'+esc(x.date)+'<br>'+esc(x.time)+'</td><td>'+esc(x.guests)+'</td><td>'+esc(x.status)+'</td><td><div class="actions"><select data-id="'+esc(x.id)+'" class="status"><option>Pending</option><option>Confirmed</option><option>Cancelled</option><option>Completed</option></select><button data-action="delete" data-id="'+esc(x.id)+'" class="danger">Delete</button></div></td></tr>').join('')+
    '</tbody></table>';
  document.querySelectorAll('.status').forEach(s=>s.value=res.find(x=>x.id===s.dataset.id)?.status||'Pending');
  document.querySelectorAll('.status').forEach(s=>s.onchange=async()=>{try{await api('/api/admin/reservations/'+encodeURIComponent(s.dataset.id),{method:'PATCH',body:JSON.stringify({status:s.value})});load()}catch(e){alert(e.message)}});
  document.querySelectorAll('[data-action="delete"]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this reservation?'))return;try{await api('/api/admin/reservations/'+encodeURIComponent(b.dataset.id),{method:'DELETE'});load()}catch(e){alert(e.message)}});
  $('menuTable').innerHTML='<table><thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Action</th></tr></thead><tbody>'+
    m.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.cat)+'</td><td>Rs '+esc(x.price)+'</td><td>'+((x.inStock)?'Available':'Out of stock')+'</td><td><button data-menu="'+esc(x.id)+'">'+(x.inStock?'Disable':'Enable')+'</button></td></tr>').join('')+
    '</tbody></table>';
  document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=async()=>{try{await api('/api/admin/menu/'+encodeURIComponent(b.dataset.menu)+'/toggle-stock',{method:'PATCH'});load()}catch(e){alert(e.message)}});
 }catch(e){alert(e.message)}
}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
$('login').onclick=async()=>{
 $('loginError').textContent='';
 try{const r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});const b=await r.json();if(!r.ok)throw new Error(b.error||'Login failed');token=b.token;localStorage.setItem('bbc_admin_token',token);$('loginCard').classList.add('hidden');$('dashboard').classList.remove('hidden');load()}catch(e){$('loginError').textContent=e.message}
};
$('logout').onclick=logout;
if(token){$('loginCard').classList.add('hidden');$('dashboard').classList.remove('hidden');load();}
})();
</script>
</body>
</html>
